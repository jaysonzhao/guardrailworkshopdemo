# Adapted from the source GPU manifest. The selected project owns the model cache.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nemotron-safety-guard-model-cache
  labels:
    app.kubernetes.io/name: nemotron-safety-guard-vllm
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemotron-safety-guard-vllm
  labels:
    app.kubernetes.io/name: nemotron-safety-guard-vllm
    app.kubernetes.io/component: model-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nemotron-safety-guard-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemotron-safety-guard-vllm
        app.kubernetes.io/component: model-server
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: fetch-model-if-missing
        image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.3.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -c
        args:
        - |
          from pathlib import Path
          from huggingface_hub import snapshot_download

          repo = "nvidia/Llama-3.1-Nemotron-Safety-Guard-8B-v3"
          revision = "8fdc246ba3d56db9c469d534233b9f582d3afafa"
          cache = Path("/models/hf")
          snapshot = cache / "models--nvidia--Llama-3.1-Nemotron-Safety-Guard-8B-v3" / "snapshots" / revision
          required = [
              "config.json",
              "generation_config.json",
              "model.safetensors.index.json",
              "model-00001-of-00004.safetensors",
              "model-00002-of-00004.safetensors",
              "model-00003-of-00004.safetensors",
              "model-00004-of-00004.safetensors",
              "tokenizer.json",
              "tokenizer_config.json",
              "special_tokens_map.json",
          ]
          if not all((snapshot / name).is_file() for name in required):
              snapshot_download(repo_id=repo, revision=revision, cache_dir=str(cache), allow_patterns=required)
          if not all((snapshot / name).is_file() for name in required):
              raise RuntimeError("Model cache is incomplete after Hugging Face download")
          print(f"Model {repo}@{revision} is cached locally")
        env:
        - name: HF_HOME
          value: /models/hf
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: HF_HUB_DISABLE_TELEMETRY
          value: '1'
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: grlab-hub
              key: token
              optional: true
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: model-cache
          mountPath: /models
      containers:
      - name: vllm
        image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.3.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model=/models/hf/models--nvidia--Llama-3.1-Nemotron-Safety-Guard-8B-v3/snapshots/8fdc246ba3d56db9c469d534233b9f582d3afafa
        - --served-model-name=nvidia/Llama-3.1-Nemotron-Safety-Guard-8B-v3
        - --host=0.0.0.0
        - --port=8000
        - --dtype=bfloat16
        - --max-model-len=8192
        - --max-num-seqs=4
        - --gpu-memory-utilization=0.85
        - --disable-log-requests
        env:
        - name: HOME
          value: /home
        - name: HF_HOME
          value: /models/hf
        - name: HF_HUB_CACHE
          value: /models/hf
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: HF_HUB_DISABLE_TELEMETRY
          value: '1'
        - name: VLLM_CACHE_ROOT
          value: /tmp/vllm-cache
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: '4'
            memory: 24Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '8'
            memory: 48Gi
            nvidia.com/gpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 360
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: home
          mountPath: /home
        - name: tmp
          mountPath: /tmp
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: nemotron-safety-guard-model-cache
      - name: home
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: nemotron-safety-guard-vllm
  labels:
    app.kubernetes.io/name: nemotron-safety-guard-vllm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nemotron-safety-guard-vllm
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grlab-content-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: nemotron-safety-guard-vllm}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: grlab-rails}}}]
      ports: [{port: 8000, protocol: TCP}]
